<html>
  <head>
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="main.css">
  </head>
  <body>
    <div class="heading">
      <h1>Tic Tac Toe</h1>
      <h2>Two Player Mode</h2>
      <h4 id="roundCount">Round 1</h4>
    </div>
    
    <!--Scoreboard-->
    <div class="scorekeep p1" id="p1Turn">
      <span class="player">Player 1: </span>
      <span class="score" id="p1Score">0</span>
    </div>
    <div class="scorekeep p2" id="p2Turn">
      <span class="player">Player 2: </span>
      <span class="score" id="p2Score">0</span>
    </div>

    <!--Play Grid-->
    <div class="play-grid" id="playGrid"></div>
    <script src="tpgame.js"></script>
  </body>
</html>
